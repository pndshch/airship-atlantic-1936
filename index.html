<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>エアシップ・アトランティック 1936 | Pinda Lab</title>
<meta name="description" content="ヒンデンブルク号の大西洋横断初飛行。雲の中の郵便袋を集めよう。">
<meta property="og:title" content="Airship Atlantic 1936">
<meta property="og:description" content="Hindenburg first transatlantic 1936. Grab the mailbags in the clouds.">
<meta name="twitter:card" content="summary">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; color:#e6edf3; font-family:'Hiragino Maru Gothic ProN', system-ui, sans-serif; user-select:none; }
#scene { position:fixed; inset:0; }
.hud { position:fixed; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; }
.badge { background:rgba(13,17,23,0.7); border:1px solid #30363d; border-radius:10px; padding:8px 14px; backdrop-filter:blur(6px); }
.badge .lbl { font-size:10px; color:#8b949e; letter-spacing:1px; text-transform:uppercase; font-family:system-ui,sans-serif; }
.badge .val { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
.title-bar { position:fixed; bottom:14px; left:0; right:0; text-align:center; pointer-events:none; z-index:5; }
.title-bar h1 { font-size:18px; font-weight:800; }
.title-bar .sub { font-size:11px; color:#8b949e; margin-top:2px; font-family:system-ui,sans-serif; }
.lang-switch { position:fixed; top:12px; right:12px; display:flex; gap:2px; background:rgba(22,27,34,0.9); border:1px solid #30363d; border-radius:8px; padding:3px; z-index:10; pointer-events:auto; }
.lang-btn { background:transparent; border:none; color:#7d8590; font-size:11px; font-weight:600; padding:4px 8px; border-radius:5px; cursor:pointer; font-family:system-ui,sans-serif; }
.lang-btn.active { background:#60a5fa; color:#0d1117; }
.help { position:fixed; bottom:80px; left:0; right:0; text-align:center; color:#8b949e; font-size:12px; pointer-events:none; z-index:5; opacity:0.85; }
.banner { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(13,17,23,0.92); border:1px solid #60a5fa; border-radius:16px; padding:24px 32px; text-align:center; z-index:20; min-width:260px; }
.banner .big { font-size:30px; font-weight:800; color:#60a5fa; }
.banner .small { font-size:13px; color:#8b949e; margin-top:6px; line-height:1.6; }
.banner button { margin-top:14px; background:#60a5fa; color:#0d1117; border:none; padding:8px 22px; border-radius:8px; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; }
.hidden { display:none !important; }
.toast { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); background:#60a5fa; color:#0d1117; padding:6px 14px; border-radius:14px; font-weight:800; font-size:18px; pointer-events:none; opacity:0; transition:opacity 0.2s, top 0.4s; z-index:15; }
.toast.show { opacity:1; top:24%; }
.foot { position:fixed; bottom:6px; right:10px; font-size:10px; color:#484f58; font-family:system-ui,sans-serif; z-index:5; }
.foot a { color:#7d8590; text-decoration:none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
    <div class="badge"><div class="lbl" data-i18n="score">SCORE</div><div class="val" id="score">0</div></div>
    <div class="badge"><div class="lbl" data-i18n="time">TIME</div><div class="val" id="time">30</div></div>
</div>
<div class="lang-switch">
    <button class="lang-btn active" data-lang="ja">JP</button>
    <button class="lang-btn" data-lang="en">EN</button>
</div>
<div class="help" id="help" data-i18n="help">郵便袋をタップで回収</div>
<div class="title-bar">
    <h1 data-i18n="titleBar">エアシップ・アトランティック 1936</h1>
    <div class="sub" data-i18n="sub">90年前 · 1936 · 大西洋初飛行</div>
</div>
<div class="toast" id="toast"></div>
<div class="banner hidden" id="banner">
    <div class="big" id="bannerBig">+1</div>
    <div class="small" id="bannerSmall" data-i18n="bannerSmall">届けた郵便袋</div>
    <button id="restart" data-i18n="restart">もう一度</button>
</div>
<div class="foot"><a href="https://pndshch.github.io/" target="_blank">← Pinda Lab</a></div>

<script>
window.__GAME_CFG__ = {"bg1": "#0a1530", "bg2": "#1e3a8a", "accent": "#60a5fa", "glb": "scene.glb", "spawnTypes": [{"name": "mail", "score": 1, "tint": "#a78bfa"}], "duration": 30, "modelSize": 2.4, "spawnInterval": 0.7};
window.__I18N__ = {"ja": {"score": "スコア", "time": "残り時間", "help": "郵便袋をタップで回収", "titleBar": "エアシップ・アトランティック 1936", "sub": "90年前 · 1936 · 大西洋初飛行", "bannerSmall": "届けた郵便袋", "restart": "もう一度"}, "en": {"score": "SCORE", "time": "TIME", "help": "Tap mailbags to collect", "titleBar": "Airship Atlantic 1936", "sub": "90yrs ago · 1936 · First Atlantic crossing", "bannerSmall": "Mailbags delivered", "restart": "Replay"}};
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================ GAME CONFIG (overridden per game) ================
const CFG = window.__GAME_CFG__ || {
    bg1: '#0d1117', bg2: '#1a2236', accent: '#34d399',
    glb: 'scene.glb', spawnTypes: [{name:'mob', score:1}],
    duration: 30,
};

const I18N = window.__I18N__ || { ja:{}, en:{} };

// ================ THREE.js setup ================
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const bg = new THREE.Color(CFG.bg1);
scene.background = bg;
scene.fog = new THREE.Fog(CFG.bg2, 18, 60);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 4, 12);
camera.lookAt(0, 1, 0);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x202030, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -15; sun.shadow.camera.right=15;
sun.shadow.camera.top=15; sun.shadow.camera.bottom=-15;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
    new THREE.CircleGeometry(40, 48),
    new THREE.MeshStandardMaterial({color: new THREE.Color(CFG.bg2).lerp(new THREE.Color('#000'), 0.4), roughness:0.9})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Decorative ring
const ring = new THREE.Mesh(
    new THREE.TorusGeometry(8, 0.08, 8, 64),
    new THREE.MeshStandardMaterial({color: CFG.accent, emissive: CFG.accent, emissiveIntensity:0.5})
);
ring.rotation.x = -Math.PI/2;
ring.position.y = 0.05;
scene.add(ring);

// ================ Load glb model ================
let modelTemplate = null;
const loader = new GLTFLoader();
loader.load(CFG.glb, (g)=>{
    modelTemplate = g.scene;
    modelTemplate.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }});
    // normalize size
    const box = new THREE.Box3().setFromObject(modelTemplate);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetSize = CFG.modelSize || 1.6;
    if(maxDim > 0) modelTemplate.scale.multiplyScalar(targetSize / maxDim);
    // center bottom on origin
    const box2 = new THREE.Box3().setFromObject(modelTemplate);
    const c = box2.getCenter(new THREE.Vector3());
    modelTemplate.position.x -= c.x; modelTemplate.position.z -= c.z;
    modelTemplate.position.y -= box2.min.y;
    startGame();
}, undefined, (err)=>{
    console.warn('glb load failed, using fallback', err);
    modelTemplate = makeFallbackMesh();
    startGame();
});

function makeFallbackMesh(){
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color: CFG.accent});
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 0), mat);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
    return g;
}

// ================ Game state ================
let mobs = []; // {root, type, vy, life}
let score = 0;
let timeLeft = CFG.duration;
let gameRunning = false;
let lastSpawn = 0;
const clock = new THREE.Clock();

function spawnMob(){
    if(!modelTemplate) return;
    const mob = modelTemplate.clone(true);
    mob.traverse(o=>{ if(o.isMesh){ o.material = o.material.clone(); }});
    // randomize tint per type if multiple types
    const t = CFG.spawnTypes[Math.floor(Math.random()*CFG.spawnTypes.length)];
    if(t.tint){
        mob.traverse(o=>{ if(o.isMesh && o.material.color){ o.material.color.set(t.tint); }});
    }
    const angle = Math.random() * Math.PI * 2;
    const dist = 5 + Math.random() * 4;
    mob.position.set(Math.cos(angle)*dist, 0.5 + Math.random()*3.5, Math.sin(angle)*dist);
    const scale = 0.7 + Math.random()*0.6;
    mob.scale.multiplyScalar(scale);
    mob.userData = { type: t, life: 0, vy: -0.3 - Math.random()*0.4, ay: 0, vrot: (Math.random()-0.5)*2 };
    scene.add(mob);
    mobs.push(mob);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function onTap(ev){
    if(!gameRunning) return;
    const r = canvas.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    pointer.x = (x/r.width)*2 - 1;
    pointer.y = -(y/r.height)*2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(mobs, true);
    if(hits.length){
        let root = hits[0].object;
        while(root.parent && !mobs.includes(root)) root = root.parent;
        const t = root.userData.type;
        score += t.score;
        document.getElementById('score').textContent = score;
        showToast('+'+t.score);
        // pop animation
        const popDur = 0.25; const start = performance.now();
        const initialScale = root.scale.x;
        const popAnim = ()=>{
            const e = (performance.now()-start)/1000/popDur;
            if(e >= 1){ scene.remove(root); mobs = mobs.filter(m=>m!==root); return; }
            root.scale.setScalar(initialScale * (1 + e*0.6));
            root.position.y += 0.05;
            root.traverse(o=>{ if(o.isMesh){ o.material.transparent=true; o.material.opacity = 1-e; }});
            requestAnimationFrame(popAnim);
        };
        popAnim();
    }
}
canvas.addEventListener('click', onTap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); onTap(e); }, {passive:false});

function showToast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(()=>t.classList.remove('show'), 600);
}

function startGame(){
    score = 0; timeLeft = CFG.duration; gameRunning = true;
    document.getElementById('score').textContent = '0';
    document.getElementById('time').textContent = timeLeft;
    document.getElementById('banner').classList.add('hidden');
    mobs.forEach(m=>scene.remove(m));
    mobs = [];
    lastSpawn = 0;
}

function endGame(){
    gameRunning = false;
    document.getElementById('bannerBig').textContent = score;
    document.getElementById('banner').classList.remove('hidden');
}

document.getElementById('restart').addEventListener('click', startGame);

// Tick
let tSec = 0;
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    tSec += dt;
    // ring pulse
    ring.scale.setScalar(1 + 0.04*Math.sin(tSec*2));
    // camera gentle orbit
    const camR = 13;
    camera.position.x = Math.sin(tSec*0.07) * camR * 0.3;
    camera.position.z = camR + Math.cos(tSec*0.07) * 1.2;
    camera.position.y = 4.5 + Math.sin(tSec*0.4)*0.4;
    camera.lookAt(0, 1.4, 0);

    // spawn
    if(gameRunning){
        if(tSec - lastSpawn > (CFG.spawnInterval || 0.7)){
            lastSpawn = tSec;
            spawnMob();
        }
        // mob update
        for(let i=mobs.length-1; i>=0; i--){
            const m = mobs[i];
            m.userData.life += dt;
            m.position.y += m.userData.vy * dt;
            m.rotation.y += m.userData.vrot * dt;
            if(m.position.y < 0.2 || m.userData.life > 4){
                scene.remove(m);
                mobs.splice(i,1);
            }
        }
        // time
        timeLeft -= dt;
        if(timeLeft <= 0){
            timeLeft = 0;
            endGame();
        }
        document.getElementById('time').textContent = Math.ceil(timeLeft);
    }
    renderer.render(scene, camera);
}
animate();

// resize
window.addEventListener('resize', ()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});

// i18n
let lang = 'ja';
function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k = el.getAttribute('data-i18n');
        if(I18N[lang] && I18N[lang][k]) el.textContent = I18N[lang][k];
    });
}
document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        lang = btn.dataset.lang;
        document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b===btn));
        applyLang();
    });
});
applyLang();
</script>
</body>
</html>
